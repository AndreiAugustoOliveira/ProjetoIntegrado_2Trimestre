<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Monitoramento</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f2f4f7;
            color: #222;
        }

        header {
            background: #1e293b;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 8px;
        }

        header p {
            color: #cbd5e1;
        }

        main {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            font-size: 16px;
            color: #64748b;
            margin-bottom: 15px;
        }

        .valor {
            font-size: 40px;
            font-weight: bold;
        }

        .classificacao {
            font-size: 30px;
            font-weight: bold;
        }

        .status {
            display: inline-block;
            padding: 8px 14px;
            border-radius: 20px;
            background: #dcfce7;
            color: #166534;
            font-weight: bold;
        }

        .historico-container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        .historico-container h2 {
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #f8fafc;
            color: #475569;
        }

        .sem-dados {
            text-align: center;
            padding: 30px;
            color: #64748b;
        }

        @media (max-width: 700px) {
            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Monitoramento de Leituras</h1>
        <p>Sistema de aquisição, processamento e classificação</p>
    </header>

    <main>

        <div class="cards">

            <div class="card">
                <h2>Leitura atual</h2>
                <div class="valor" id="valorAtual">
                    --
                </div>
            </div>

            <div class="card">
                <h2>Classificação</h2>
                <div class="classificacao" id="classificacao">
                    --
                </div>
            </div>

            <div class="card">
                <h2>Estado do sistema</h2>
                <div class="status" id="status">
                    Aguardando
                </div>

                <p id="horario" style="margin-top: 15px; color: #64748b;">
                    Nenhuma leitura recebida
                </p>
            </div>

        </div>

        <div class="historico-container">

            <h2>Histórico de leituras</h2>

            <table>
                <thead>
                    <tr>
                        <th>Valor</th>
                        <th>Classificação</th>
                        <th>Data e hora</th>
                    </tr>
                </thead>

                <tbody id="tabelaHistorico">
                    <tr>
                        <td colspan="3" class="sem-dados">
                            Aguardando leituras...
                        </td>
                    </tr>
                </tbody>
            </table>

        </div>

    </main>

    <script>

        async function atualizarDados() {

            try {

                const resposta = await fetch('/leituras');

                if (!resposta.ok) {
                    throw new Error('Nenhuma leitura disponível');
                }

                const dados = await resposta.json();

                const atual = dados.atual;

                // Leitura atual
                document.getElementById('valorAtual').textContent =
                    atual.valor;

                // Classificação
                document.getElementById('classificacao').textContent =
                    atual.classificacao;

                // Estado
                document.getElementById('status').textContent =
                    'Online';

                // Horário
                const data = new Date(atual.timestamp);

                document.getElementById('horario').textContent =
                    'Última atualização: ' +
                    data.toLocaleString('pt-BR');

                // Histórico
                const tabela =
                    document.getElementById('tabelaHistorico');

                tabela.innerHTML = '';

                dados.historico.slice().reverse().forEach(leitura => {

                    const linha = document.createElement('tr');

                    const dataLeitura =
                        new Date(leitura.timestamp);

                    linha.innerHTML = `
                        <td>${leitura.valor}</td>
                        <td>${leitura.classificacao}</td>
                        <td>${dataLeitura.toLocaleString('pt-BR')}</td>
                    `;

                    tabela.appendChild(linha);

                });

            } catch (erro) {

                document.getElementById('status').textContent =
                    'Aguardando';

            }

        }

        // Atualiza imediatamente
        atualizarDados();

        // Atualiza a cada 2 segundos
        setInterval(atualizarDados, 2000);

    </script>

</body>
</html>
