<!DOCTYPE html>

<html lang="pt-BR">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <title>Movi Locadora</title>
  <style>
  body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #fff7ed 0%, #ffb347 100%);
    min-height: 100vh;
    margin: 0;
    padding: 2rem;
    color: #333;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

h1 {
    color: #ff8c00;
    font-size: 2.5rem;
    font-weight: 700;
    text-align: center;
    margin-bottom: 1rem;
}

h2 {
    color: #ff8c00;
    font-size: 1.5rem;
    text-align: left;
    margin-bottom: 1rem;
}

.container-cards {
  display: grid;
    grid-template-columns: repeat(3, 1fr);
    column-gap: 80px;
    row-gap: 40px;
    width: 100%;
    max-width: 1500px; /* aumenta a área dos cards */
    align-items: start;
    margin:  auto;
  }

.card {
    background: rgba(255,255,255,.75);
    backdrop-filter: blur(15px);
    border-radius: 30px;
    padding: 1.8rem;
    width: 100%;
    box-shadow: 0 10px 30px rgba(0,0,0,.15);
    border: 1px solid rgba(255,255,255,.6);
    box-sizing: border-box;
    transition: .3s;
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 35px rgba(255,153,0,.3);
}

/* Card da reserva ocupa toda a largura */
.reserva {
    grid-column: span 2;
}

label {
    font-weight: 600;
    color: #555;
}

select,
input {
    padding: .7rem 1rem;
    border: none;
    outline: none;
    border-radius: 12px;
    background: white;
    margin: .4rem;
    font-size: .95rem;
    box-shadow: inset 0 0 5px rgba(0,0,0,.1);
    transition: .3s;
}

select:focus,
input:focus {
    box-shadow: 0 0 0 3px rgba(255,153,0,.25);
}

button {
    background: linear-gradient(135deg,#ff9900,#ffb84d);
    color: white;
    border: none;
    border-radius: 14px;
    padding: .7rem 1.5rem;
    cursor: pointer;
    font-weight: bold;
    font-size: 1rem;
    margin-top: .5rem;
    box-shadow: 0 5px 15px rgba(255,153,0,.35);
    transition: .3s;
}

button:hover {
    transform: translateY(-3px);
    background: linear-gradient(135deg,#ff7b00,#ff9900);
    box-shadow: 0 8px 20px rgba(255,153,0,.5);
}

table {
    width: 100%;
    margin-top: 1rem;
    border-collapse: collapse;
    border-radius: 15px;
    overflow: hidden;
}

th {
    background: #ff9900;
    color: white;
    padding: .9rem;
    text-align: center;
}

td {
    background: white;
    padding: .8rem;
    text-align: center;
    border-bottom: 1px solid #eee;
}

tr:hover td {
    background: #fff3df;
}

#msg-login,
#msg-reserva {
    margin-top: .8rem;
    text-align: center;
    font-weight: bold;
}

.ok {
    color: #2eaa57;
}

.erro {
    color: #d64545;
}
 
.topo {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 20px;
}


.logo {
    width: 200px;
    height: 100px;
    object-fit: contain;
    filter: drop-shadow(0 5px 10px rgba(0,0,0,0.15));
}

 </style>
</head>
<body>
  
  <header class="topo">
    <img src="logo.png" class="logo" alt="Movi Locadora">
 <h1> Locadora de carros</h1>
  </header>
  
<div class="container-cards">

  <div class="card">
    <h2>1. Login do usuário</h2>
    <input id="usuario" placeholder="usuário">
    <input id="senha" type="password" placeholder="senha">
    <button onclick="fazerLogin()">Entrar</button>
    <p id="msg-login"></p>
  </div>

  <div class="card">
    <h2>2. Consultar modelos</h2>
    <label for="modelo">Filtrar por modelo:</label>
    <select id="modelo">
      <option value="">todos</option>
      <option value="Polo">Polo</option>
      <option value="Onix">Onix</option>
      <option value="Corolla">Corolla</option>
      <option value="Mobi">Mobi</option>
      <option value="Kwid">Kwid</option>
      <option value="SW4">SW4</option>
      <option value="Creta">Creta</option>
      <option value="Renegade">Renegade</option>
    </select>
    <button onclick="listar()">Buscar</button>
    <table id="tabela">
      <thead><tr><th>ID</th><th>Categoria</th><th>Montadora</th><th>Qtd.</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="card">
    <h2>3. Reservar veículo</h2>
    <input id="reserva-id" type="number" min="0" max="8" placeholder="id do carro" style="width:90px">
    <input id="reserva-qtd" type="number" min="1" placeholder="quantidade" style="width:110px">
    <input id="reserva-usuario" placeholder="nome do usuário">
    <button onclick="reserva()">Reservar</button>
    <p id="msg-reserva"></p>
  </div>
 </div>
  <script>
   
  let logado = false;

    async function listar() {
      const modelo = document.getElementById('modelo').value;
      const url = modelo ? '/carros?modelo=' + modelo : '/carros';
      const resposta = await fetch(url);
      const lista = await resposta.json();
      const corpo = document.querySelector('#tabela tbody');
      corpo.innerHTML = '';
      for (const c of lista) {
        corpo.innerHTML += `<tr><td>${c.id}</td><td>${c.categoria}</td><td>${c.montadora}</td><td>${c.quantidade}</td></tr>`;
      }
    }

    async function fazerLogin() {
      const resposta = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          usuario: document.getElementById('usuario').value,
          senha: document.getElementById('senha').value
        })
      });
      const dados = await resposta.json();
      const msg = document.getElementById('msg-login');
      msg.textContent = (dados.mensagem || dados.erro) + ' (status ' + resposta.status + ')';
      msg.className = resposta.status === 200 ? 'ok' : 'erro';
    if (resposta.status === 200) {
    logado = true;
   } else {
    logado = false;
   }
    }

    async function reserva() {
      if (!logado) {
        const msg = document.getElementById('msg-reserva');
        msg.textContent = "Faça login antes de reservar.";
        msg.className = "erro";
        return;
    }
      const resposta = await fetch('/reserva', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          id: Number(document.getElementById('reserva-id').value),
          quantidade: Number(document.getElementById('reserva-qtd').value),
          usuario: document.getElementById('reserva-usuario').value
        })
      });
      const dados = await resposta.json();
      const msg = document.getElementById('msg-reserva');
      msg.textContent = (dados.mensagem || dados.erro) + ' (status ' + resposta.status + ')';
      msg.className = resposta.status === 201 ? 'ok' : 'erro';
      listar(); 
    }

    listar(); 
  </script>
</body>
</html>
